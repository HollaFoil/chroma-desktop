[config]
[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'
# No post_hook: waybar has "reload_style_on_change": true and its CssReloadHelper
# follows the @import of colors.css, so the style retints on write. A SIGUSR2
# reload would recreate the bar; its exclusive zone blinks and every window
# under it gets resized (a scroll-snap page like YouTube Shorts jumps a slide).

[templates.quickshell]
# The shell's palette as JSON: every colour role plus the wallpaper path and
# mode. Theme/Colors.qml watches the file and every bound colour animates to
# the new value; the post_hook copies it (and the wallpaper) to
# /etc/greetd/theme for the login screen, a no-op without greetd.
input_path = '~/.config/matugen/templates/quickshell.json'
output_path = '~/.config/matugen/generated/quickshell.json'
post_hook = '~/.local/bin/greeter-sync'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hypr-colors.lua'
output_path = '~/.config/hypr/colors.lua'
post_hook = 'hyprctl reload 2>/dev/null || true'  # no-op outside a Hyprland session

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/colors.conf'
post_hook = 'pkill -SIGUSR1 kitty || true'  # pkill is non-zero with no kitty open

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock-colors.conf'

[templates.homelab-dash]
# Same palette the waybar template emits (86 @define-color rules, which is
# valid GTK CSS). No post_hook: homelab-dash watches this file itself, so it
# restyles live and does not need to be running when matugen fires.
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/homelab-dash/colors.css'

[templates.colorsh]
input_path = '~/.config/matugen/templates/colors.sh'
output_path = '~/.config/matugen/colors.sh'

[templates.icons]
# matugen-icons rebuilds ~/.local/share/icons/Matugen: Adwaita's folders and
# mimetype accents with their blues swapped for the primary, the rest of
# Adwaita symlinked in, breeze-dark inherited for app icons. It ends by
# bouncing the gsettings icon-theme key so open GTK apps (Nemo) repaint.
input_path = '~/.config/matugen/templates/icon-colors.sh'
output_path = '~/.config/matugen/generated/icon-colors.sh'
post_hook = '~/.local/bin/matugen-icons'

[config.custom_colors]
ansi_red     = { color = "#ff0000", blend = true }
ansi_green   = { color = "#00c000", blend = true }
ansi_yellow  = { color = "#e0c000", blend = true }
ansi_blue    = { color = "#0060ff", blend = true }
ansi_magenta = { color = "#c000c0", blend = true }
ansi_cyan    = { color = "#00c0c0", blend = true }

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.kde]
input_path = '~/.config/matugen/templates/Matugen.colors'
output_path = '~/.local/share/color-schemes/Matugen.colors'

[templates.vscode-raw]
# Consumed by the "Matugen Theme" VSCodium/VS Code extension (haikalllp.matugen-theme),
# which watches both files under ~/.cache/matugen and reloads the editor theme live.
input_path = '~/.config/matugen/templates/vscode-colors'
output_path = '~/.cache/matugen/vscode-colors'

[templates.vscode-json]
input_path = '~/.config/matugen/templates/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
# btop re-reads its config and theme on SIGUSR2 and repaints in place; see
# reload-btop. No restart, so a running btop keeps its window and its state.
post_hook = '~/.local/bin/reload-btop'

[templates.discord]
input_path = '~/.config/matugen/templates/discord.css'
output_path = '~/.config/vesktop/settings/quickCss.css'
# No post_hook: Vencord watches quickCss.css and re-applies it on write, so
# vesktop restyles live. Requires "useQuickCss": true in vesktop's settings.json.

[templates.firefox]
input_path = '~/.config/matugen/templates/firefox-colors.css'
# The MatugenFox extension's default colorsPath. No post_hook: its native
# host (matugenfox-host, spawned by Firefox) polls this file's mtime every
# 2s and pushes the new palette to the running browser.
output_path = '~/.config/matugen/generated/firefox_websites.css'

[templates.spicetify]
input_path = '~/.config/matugen/templates/spicetify-color.ini'
output_path = '~/.config/spicetify/Themes/Text/color.ini'
# `refresh` re-reads the theme's colours in the running client; `apply` would
# re-patch Spotify and restart it. Guarded because it exits non-zero when
# Spotify is not running.
post_hook = 'spicetify refresh >/dev/null 2>&1 || true'

[templates.steam]
input_path = '~/.config/matugen/templates/steam-colors.css'
output_path = '~/.config/matugen/generated/steam-colors.css'
# Adwaita-for-Steam (git clone in ~/.local/src) patches Steam's steamui/css to
# @import its bundle and copies this file in as adwaita/custom.css, loaded after
# the base colour theme. Re-running the installer on every render also repairs
# the patch when a Steam client update wipes it. The cd is load-bearing:
# install.py resolves its own adwaita/ sources relative to cwd and removes the
# old install before copying, so run from elsewhere it wipes the skin and
# then fails. Steam has no CSS hot-reload, so reload-steam-css then pushes the
# rendered file into every open client window over Steam's DevTools port
# (enabled by ~/.steam/steam/.cef-enable-remote-debugging); it is a no-op when
# Steam is closed. Both guarded so nothing here fails the matugen run.
post_hook = 'cd ~/.local/src/Adwaita-for-Steam && python install.py -t default -c adwaita -a theme -s {{mode}} --custom-css ~/.config/matugen/generated/steam-colors.css >/dev/null 2>&1; ~/.local/bin/reload-steam-css >/dev/null 2>&1 || true'

[templates.swayimg]
# init.lua binds SIGUSR1 to re-read this file and repaint, so open viewers
# retint too. pkill is non-zero when none is running.
input_path = '~/.config/matugen/templates/swayimg-colors.lua'
output_path = '~/.config/swayimg/colors.lua'
post_hook = 'pkill -USR1 -x swayimg || true'

[templates.modernz]
# No post_hook: mpv/scripts/matugen-reload.lua watches this file's mtime and
# pushes the values into mpv's script-opts, which ModernZ applies live.
input_path = '~/.config/matugen/templates/modernz.conf'
output_path = '~/.config/mpv/script-opts/modernz.conf'

[templates.qt6ct]
# Qt apps: QT_QPA_PLATFORMTHEME=qt6ct (hypr/conf/env.lua) applies this palette
# with the Breeze widget style (qt6ct/qt6ct.conf). Qt has no reload hook, so
# open Qt windows keep their colours until relaunched; KDE apps (kate,
# kdeconnect) additionally read kdeglobals -> Matugen.colors above.
input_path = '~/.config/matugen/templates/qt6ct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.wallgreet]
# The login screen (system/greetd/wallgreet). The first line of the output
# names the wallpaper (matugen's image keyword); greeter-sync copies the
# stylesheet, that picture, monitors.lua and colors.lua into /etc/greetd/theme,
# which ./greeter install made writable by you. Without that directory the
# hook is a no-op.
input_path = '~/.config/matugen/templates/wallgreet.css'
output_path = '~/.config/matugen/generated/wallgreet.css'
post_hook = '~/.local/bin/greeter-sync'
