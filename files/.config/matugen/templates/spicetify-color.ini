; Spicetify colour scheme generated by matugen - do not edit, edit the template:
; ~/.config/matugen/templates/spicetify-color.ini
;
; Lands next to Text's vendored user.css as the theme's only scheme. Text ships
; 20 schemes of its own, but `spicetify config color_scheme` can only select a
; section that exists on disk, so the generated [matugen] section replaces that
; file wholesale rather than being appended to it.
;
; Values are bare hex with no leading '#': that is the format spicetify's
; color.ini parser expects, hence hex_stripped rather than hex. Spicetify
; derives the --spice-rgb-* variants Text needs from these automatically.
;
; The mapping follows Text's own schemes role for role - a dark ground, light
; body copy, muted borders, one accent in a resting/bright pair - with every
; value taken from the wallpaper's palette. The accent is the primary hue: the
; play button, the progress bar, the header title, the active pane border, the
; avatar and the highlighted (bright-accent) states all follow the wallpaper.
; Until 1.3.1 the accent was ansi_green, a gruvbox green merely tinted toward
; the wallpaper, which left those elements green under every palette.

[matugen]
; Body copy on the app ground.
text               = {{colors.on_surface.default.hex_stripped}}
subtext            = {{colors.on_surface_variant.default.hex_stripped}}

; The app ground: surface_container, a step above the darkest surface, the
; same tone the other schemes use for main.
main               = {{colors.surface_container.default.hex_stripped}}

; Accent. Text wires these to --spice-button, --spice-button-active and
; --spice-button-disabled respectively. Resting is the primary; active - the
; progress bar fill, elapsed time, the bright-accent state of buttons - steps
; up to primary_fixed, the lighter tone of the same hue.
accent             = {{colors.primary.default.hex_stripped}}
accent-active      = {{colors.primary_fixed.default.hex_stripped}}
; Every one of Text's 20 schemes sets accent-inactive equal to main, so
; disabled buttons and --decorative-subdued sink into the ground. Kept.
accent-inactive    = {{colors.surface_container.default.hex_stripped}}

; Entity-header titles and the big lyric/quote blocks - foreground text, not a
; fill, so it takes the accent rather than a surface.
banner             = {{colors.primary.default.hex_stripped}}

; Borders. Inactive is the hairline just above the ground; active is the
; accent, as in every Text scheme.
border-active      = {{colors.primary.default.hex_stripped}}
border-inactive    = {{colors.surface_container_highest.default.hex_stripped}}

; Nav and sidebar labels drawn in ::before pseudo-elements. Text's schemes pick
; a deliberately-subdued mid grey, but at matugen's outline_variant that lands
; near-invisible on some wallpapers, so this is outline: still low-emphasis,
; still legible.
header             = {{colors.outline.default.hex_stripped}}

; Row hover, press, and the selected track row - a background, so it has to
; stay well under `text`. outline_variant sits a clear step above the ground.
; Also used at 0.5 alpha for --background-highlight, which is why it is a mid
; tone and not a surface.
highlight          = {{colors.outline_variant.default.hex_stripped}}

; Toast fills. Text's user.css never references these, but Spotify's own CSS
; does, and it paints light text on them - hence the container roles, which are
; the dark end of each hue, rather than ansi_blue/error, which are the light
; end in dark mode.
notification       = {{colors.ansi_blue_container.default.hex_stripped}}
notification-error = {{colors.error_container.default.hex_stripped}}
