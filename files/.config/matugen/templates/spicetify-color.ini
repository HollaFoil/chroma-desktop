; Spicetify colour scheme generated by matugen - do not edit, edit the template:
; ~/.config/matugen/templates/spicetify-color.ini
;
; Lands next to Sleek's vendored user.css as the theme's only scheme. Sleek is
; a Marketplace theme by default, and Marketplace keeps its themes in Spotify's
; localStorage rather than on disk, so `spicetify config color_scheme` has
; nothing to select. Vendoring Sleek's user.css into a real theme folder and
; generating the color.ini beside it is what makes it addressable.
;
; Values are bare hex with no leading '#': that is the format spicetify's
; color.ini parser expects, hence hex_stripped rather than hex.
;
; Sleek's own 19 schemes disagree about what `text` means - Catppuccin uses it
; as a purple accent, Nord and TokyoNight as body text. TokyoNight's reading is
; the one followed here, so `text` is body copy and the accent lives in the
; button/nav keys. nav-active-text is deliberately on_primary: it is painted on
; top of nav-active, which is primary.

[matugen]
text               = {{colors.on_surface.default.hex_stripped}}
subtext            = {{colors.on_surface_variant.default.hex_stripped}}
nav-active-text    = {{colors.on_primary.default.hex_stripped}}

main               = {{colors.surface_container.default.hex_stripped}}
main-secondary     = {{colors.surface_container_lowest.default.hex_stripped}}
sidebar            = {{colors.surface_container_low.default.hex_stripped}}
player             = {{colors.surface_container_low.default.hex_stripped}}
card               = {{colors.surface_container_high.default.hex_stripped}}
shadow             = {{colors.surface_container_lowest.default.hex_stripped}}
tab-active         = {{colors.surface_container_high.default.hex_stripped}}

button             = {{colors.primary.default.hex_stripped}}
button-secondary   = {{colors.secondary.default.hex_stripped}}
button-active      = {{colors.primary.default.hex_stripped}}
button-disabled    = {{colors.outline_variant.default.hex_stripped}}
nav-active         = {{colors.primary.default.hex_stripped}}
play-button        = {{colors.primary.default.hex_stripped}}
playback-bar       = {{colors.primary.default.hex_stripped}}

notification       = {{colors.surface_container_high.default.hex_stripped}}
notification-error = {{colors.error.default.hex_stripped}}
misc               = {{colors.on_surface.default.hex_stripped}}
