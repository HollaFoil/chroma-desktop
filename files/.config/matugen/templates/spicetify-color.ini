; Spicetify colour scheme generated by matugen - do not edit, edit the template:
; ~/.config/matugen/templates/spicetify-color.ini
;
; Lands next to Text's vendored user.css as the theme's only scheme. Text ships
; 20 schemes of its own, but `spicetify config color_scheme` can only select a
; section that exists on disk, so the generated [matugen] section replaces that
; file wholesale rather than being appended to it.
;
; Values are bare hex with no leading '#': that is the format spicetify's
; color.ini parser expects, hence hex_stripped rather than hex. Spicetify
; derives the --spice-rgb-* variants Text needs from these automatically.
;
; The mapping follows Text's own [Gruvbox] section role for role - warm dark
; ground, cream body copy, muted borders, a green accent in a dim/bright pair -
; but sources every value from matugen so it tracks the wallpaper. The greens
; come from the ansi_green custom colour, which is declared with blend = true
; in config.toml: it is gruvbox green pulled toward the wallpaper's hue, which
; is exactly the "gruvbox that follows matugen" this theme is going for.
;
; Two deliberate departures from [Gruvbox], both noted where they occur:
; `header` is lifted to outline, and the accent pair is inverted relative to
; gruvbox's tone ordering because matugen's dark-mode greens sit high.

[matugen]
; Body copy on the app ground. Gruvbox: fbf1c7 / bdae93.
text               = {{colors.on_surface.default.hex_stripped}}
subtext            = {{colors.on_surface_variant.default.hex_stripped}}

; The app ground. Gruvbox: 282828, i.e. bg rather than bg0_h, so this is
; surface_container and not the darker surface.
main               = {{colors.surface_container.default.hex_stripped}}

; Accent. Text wires these to --spice-button, --spice-button-active and
; --spice-button-disabled respectively. Gruvbox pairs a dim 98971a with a
; bright b8bb26; matugen's dark-mode green is already bright, so the resting
; accent is ansi_green and the active one steps up to the container's
; on-colour, which is the lighter green in the same blended family.
accent             = {{colors.ansi_green.default.hex_stripped}}
accent-active      = {{colors.on_ansi_green_container.default.hex_stripped}}
; Every one of Text's 20 schemes sets accent-inactive equal to main, so
; disabled buttons and --decorative-subdued sink into the ground. Kept.
accent-inactive    = {{colors.surface_container.default.hex_stripped}}

; Entity-header titles and the big lyric/quote blocks - foreground text, not a
; fill, so it takes the accent rather than a surface. Gruvbox: b8bb26.
banner             = {{colors.ansi_green.default.hex_stripped}}

; Borders. Inactive is the hairline just above the ground (gruvbox 3c3836,
; which surface_container_highest matches almost exactly); active is the
; accent, as in gruvbox's b8bb26.
border-active      = {{colors.ansi_green.default.hex_stripped}}
border-inactive    = {{colors.surface_container_highest.default.hex_stripped}}

; Nav and sidebar labels drawn in ::before pseudo-elements. Gruvbox uses 665c54
; and Nord and Catppuccin pick the same deliberately-subdued mid grey, but at
; matugen's outline_variant that lands near-invisible on some wallpapers, so
; this is outline: still low-emphasis, still legible. This is the one place the
; scheme is louder than [Gruvbox].
header             = {{colors.outline.default.hex_stripped}}

; Row hover, press, and the selected track row - a background, so it has to
; stay well under `text`. Gruvbox 7c6f64 sits a clear step above the ground and
; outline_variant is the matugen role at that tone. Also used at 0.5 alpha for
; --background-highlight, which is why it is a mid tone and not a surface.
highlight          = {{colors.outline_variant.default.hex_stripped}}

; Toast fills. Text's user.css never references these, but Spotify's own CSS
; does, and it paints light text on them - hence the container roles, which are
; the dark end of each hue, rather than error/ansi_blue, which are the light
; end in dark mode. Gruvbox: 458588 and cc241d.
notification       = {{colors.ansi_blue_container.default.hex_stripped}}
notification-error = {{colors.error_container.default.hex_stripped}}
