# ModernZ (mpv OSC) - generated by matugen from templates/modernz.conf into
# ~/.config/mpv/script-opts/modernz.conf. Layout here, colours from the palette.

# layout
layout=default
vidscale=no
scalewindowed=1.0
scalefullscreen=1.0
osc_height=64
idlescreen=no
keeponpause=bottombar
fadeduration=180
seekbar_height=medium
slider_rounded_corners=yes
hover_effect=size,color
tooltip_hints=yes
font=Noto Sans

# what is on the bar: play/pause, jump ±, prev/next when there is a playlist,
# volume, title, chapter; right side: subtitles, audio, playlist, speed, fullscreen
show_title=yes
title=${media-title}
title_font_size=22
show_chapter_title=yes
jump_buttons=yes
jump_amount=10
chapter_skip_buttons=no
track_nextprev_buttons=yes
volume_control=yes
subtitles_button=yes
audio_tracks_button=yes
playlist_button=yes
hide_empty_playlist_button=yes
speed_button=yes
fullscreen_button=yes
loop_button=no
shuffle_button=no
info_button=no
ontop_button=no
screenshot_button=no
download_button=no
window_controls=yes
show_window_title=no

# colours (matugen)
osc_color=#{{colors.surface.default.hex_stripped}}
title_color=#{{colors.on_surface.default.hex_stripped}}
window_title_color=#{{colors.on_surface.default.hex_stripped}}
window_controls_color=#{{colors.on_surface_variant.default.hex_stripped}}
windowcontrols_close_hover=#{{colors.error.default.hex_stripped}}
windowcontrols_max_hover=#{{colors.primary.default.hex_stripped}}
windowcontrols_min_hover=#{{colors.tertiary.default.hex_stripped}}
cache_info_color=#{{colors.on_surface_variant.default.hex_stripped}}
seekbarfg_color=#{{colors.primary.default.hex_stripped}}
seekbarbg_color=#{{colors.outline_variant.default.hex_stripped}}
seekbar_cache_color=#{{colors.outline.default.hex_stripped}}
seek_handle_color=#{{colors.primary.default.hex_stripped}}
seek_handle_border_color=#{{colors.on_primary.default.hex_stripped}}
time_color=#{{colors.on_surface_variant.default.hex_stripped}}
chapter_title_color=#{{colors.on_surface_variant.default.hex_stripped}}
side_buttons_color=#{{colors.on_surface.default.hex_stripped}}
middle_buttons_color=#{{colors.on_surface.default.hex_stripped}}
playpause_color=#{{colors.on_surface.default.hex_stripped}}
held_element_color=#{{colors.outline.default.hex_stripped}}
hover_effect_color=#{{colors.primary.default.hex_stripped}}
thumbnail_box_color=#{{colors.surface_container_high.default.hex_stripped}}
thumbnail_box_outline=#{{colors.outline_variant.default.hex_stripped}}
nibble_color=#{{colors.primary.default.hex_stripped}}
nibble_current_color=#{{colors.on_surface.default.hex_stripped}}
ab_loop_color=#{{colors.tertiary.default.hex_stripped}}
