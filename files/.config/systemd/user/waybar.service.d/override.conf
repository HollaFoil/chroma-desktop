# Drop-in over the packaged /usr/lib/systemd/user/waybar.service.
#
# The packaged unit takes Restart=on-failure with stock limits, which is the
# right call mid-session - waybar segfaults in its mpris module when a player
# goes away - but it interacts badly with session teardown. When Hyprland
# exits, waybar loses the Wayland socket and dies with "Error reading events
# from display: Broken pipe"; systemd then retries it five times in about a
# second, each attempt failing instantly with "cannot open display:" because
# there is no compositor left to connect to. That burst trips the start limit,
# the unit lands in failed/start-limit-hit, and it stays there.
#
# RestartSec spaces the retries out so a teardown burns one or two attempts
# instead of all five, which leaves the budget for its intended job: bringing
# the bar back after a real mid-session crash. The wider StartLimitInterval
# keeps the give-up behaviour rather than disabling it - between sessions there
# is no compositor to connect to, and a unit retrying forever at 2s intervals
# while logged out is worse than one that stops and gets restarted at login.
#
# Giving up quietly is the other half of the old failure, hence OnFailure. See
# notify-unit-failure, which stays silent when no compositor is running so this
# does not fire on every normal logout.
[Unit]
StartLimitIntervalSec=30s
StartLimitBurst=5
OnFailure=notify-unit-failure@%n.service

[Service]
RestartSec=2s
