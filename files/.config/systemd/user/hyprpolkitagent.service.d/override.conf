# Same teardown problem as waybar, same shape of fix - see
# waybar.service.d/override.conf for the full reasoning.
#
# hyprpolkitagent aborts (SIGABRT, core dump, inside Qt's DBus thread) rather
# than exiting cleanly when the compositor goes away, and the packaged unit's
# stock Restart=on-failure then retries it five times inside a single second.
# The unit ends up rate-limited, and because the rate limit outlives the
# session, the next login's `systemctl restart hyprpolkitagent` is answered
# with "Start request repeated too quickly" and silently does nothing - a
# session with no polkit agent, so no authentication prompts anywhere.
#
# The login line now reset-failed's it, which is the actual fix; this drop-in
# stops it burning the whole restart budget in one second on the way out, and
# makes a failure it cannot recover from say so on screen.
[Unit]
StartLimitIntervalSec=30s
StartLimitBurst=5
OnFailure=notify-unit-failure@%n.service

[Service]
RestartSec=2s
