# Lock screen. Laid out like the login screen (system/greetd/wallgreet):
# date top-left, power/sleep/restart top-right, the clock as two big numbers,
# "Press any key" at the bottom; the input pill fades in under the clock when
# you type and fades out again when it is empty. Colours and the wallpaper
# come from hyprlock-colors.conf, which setwall renders.
source = ~/.config/hypr/hyprlock-colors.conf
$font = GeistMono Nerd Font Propo

general {
    hide_cursor = false
    ignore_empty_input = true
}

background {
    monitor =
    path = $wallpaper
    color = rgb(141414)
    brightness = 0.7
}

# top-left: the date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_family = $font
    font_size = 18
    color = $on_surface
    shadow_passes = 1
    shadow_size = 4
    position = 48, -40
    halign = left
    valign = top
}

# top-right: sleep, restart, power (click)
label {
    monitor =
    text = 󰤄
    onclick = systemctl suspend
    font_family = $font
    font_size = 22
    color = $on_surface_variant
    shadow_passes = 1
    shadow_size = 4
    position = -152, -38
    halign = right
    valign = top
}
label {
    monitor =
    text = 󰜉
    onclick = systemctl reboot
    font_family = $font
    font_size = 22
    color = $on_surface_variant
    shadow_passes = 1
    shadow_size = 4
    position = -100, -38
    halign = right
    valign = top
}
label {
    monitor =
    text = 󰐥
    onclick = systemctl poweroff
    font_family = $font
    font_size = 22
    color = $on_surface_variant
    shadow_passes = 1
    shadow_size = 4
    position = -48, -38
    halign = right
    valign = top
}

# centre: hours over minutes
label {
    monitor =
    text = cmd[update:1000] date +%H
    font_family = $font Bold
    font_size = 140
    color = $on_surface
    shadow_passes = 1
    shadow_size = 6
    position = 0, 85
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +%M
    font_family = $font Bold
    font_size = 140
    color = $on_surface
    shadow_passes = 1
    shadow_size = 6
    position = 0, -85
    halign = center
    valign = center
}

# under the clock: who, then the input (only visible while there is input)
label {
    monitor =
    text = 󰀄  $USER
    font_family = $font
    font_size = 15
    color = $on_surface_variant
    shadow_passes = 1
    shadow_size = 4
    position = 0, -215
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 48
    position = 0, -275
    halign = center
    valign = center
    outline_thickness = 2
    rounding = -1
    outer_color = $primary
    inner_color = $surface_container
    font_color = $on_surface
    font_family = $font
    check_color = $primary
    fail_color = $error
    fail_text = Wrong password
    placeholder_text =
    dots_center = true
    dots_size = 0.3
    dots_spacing = 0.3
    fade_on_empty = true
    fade_timeout = 5000
}

# bottom
label {
    monitor =
    text = Press any key to unlock
    font_family = $font
    font_size = 13
    color = $on_surface_variant
    shadow_passes = 1
    shadow_size = 4
    position = 0, 48
    halign = center
    valign = bottom
}
