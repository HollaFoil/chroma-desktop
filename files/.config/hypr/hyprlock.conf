source = ~/.config/hypr/hyprlock-colors.conf

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_center = true
    outer_color = $primary
    inner_color = $surface_container
    font_color = $on_surface
    fail_color = $error
    placeholder_text = Password
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    color = $on_surface
    position = 0, 100
    halign = center
    valign = center
}
