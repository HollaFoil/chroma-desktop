# mpv: video player. The stock OSC is off; ModernZ (mpv-modernz-git, loaded
# from /etc/mpv/scripts) draws a Plex/Jellyfin-style bar whose colours matugen
# writes to script-opts/modernz.conf. thumbfast gives it seekbar previews.

# ── window ──────────────────────────────────────────────────────────────────
border=no                    # ModernZ draws its own title/window controls
keep-open=yes                # stay on the last frame instead of closing
force-window=immediate
autofit-larger=72%x72%       # Hyprland floats mpv in a 72% box (conf/rules.lua); keep aspect inside it
cursor-autohide=1200

# ── ui ──────────────────────────────────────────────────────────────────────
osc=no
osd-bar=no
osd-font=Noto Sans
osd-font-size=30

# ── video ───────────────────────────────────────────────────────────────────
vo=gpu-next
hwdec=auto-safe
profile=high-quality
video-sync=display-resample

# ── audio ───────────────────────────────────────────────────────────────────
volume=100
volume-max=150
audio-file-auto=fuzzy
alang=en,eng

# ── subtitles ───────────────────────────────────────────────────────────────
sub-auto=fuzzy               # picks up "Movie.en.srt" next to "Movie.mkv"
slang=en,eng
sub-font=Noto Sans
sub-font-size=44
sub-color="#FFFFFF"
sub-border-size=2.4
sub-border-color="#000000"
sub-shadow-offset=1
sub-shadow-color="#80000000"
sub-margin-y=52
sub-ass-override=no          # styled ASS subs keep their look
embeddedfonts=yes

# ── files ───────────────────────────────────────────────────────────────────
save-position-on-quit=yes
watch-later-options=start,vid,aid,sid
screenshot-directory=~/Pictures/Screenshots
screenshot-format=png
ytdl-format=bestvideo[height<=?1440]+bestaudio/best
