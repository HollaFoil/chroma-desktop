# Read by /usr/bin/google-chrome-stable (Arch wrapper: $XDG_CONFIG_HOME/chrome-flags.conf).
#
# WHY: Chrome's default ANGLE backend on Linux is OpenGL, and on this machine
# (NVIDIA 580 + Hyprland/Wayland) that path renders ANY 10-bit video as a black
# frame. Decoding is fine -- ~194 frames/8s decode with zero drops and no error
# -- the frames simply never reach the screen.
#
# Verified by canvas pixel readback, isolating codec from bit depth:
#
#            default ANGLE=gl     --use-angle=vulkan
#   h264  8-bit   120.8               120.8
#   h264 10-bit     0.0  <- black     118.4
#   av1   8-bit   121.4               121.4
#   av1  10-bit     0.0  <- black     rendered
#
# So it was never about AV1 or the Matroska container: AV1-in-MKV plays fine at
# 8-bit, and H.264 breaks at 10-bit. Bit depth was the only variable.
#
# --ozone-platform=x11 and --disable-gpu-compositing also fix it, but give up
# native Wayland and GPU compositing respectively. Vulkan keeps both.
--use-angle=vulkan
