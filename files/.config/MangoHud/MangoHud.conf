# MangoHud: frame-pacing diagnosis, not decoration.
# Launch a game with  MANGOHUD=1 %command%  (add DXVK_HUD=compiler to see
# shader compiles as they happen). Shift_L+F2 starts/stops a CSV log in
# output_folder; ~/.local/bin/framelog reads the newest one and lists the
# spikes with the GPU clock / GPU load / CPU load at that moment.
# https://github.com/flightlessmango/MangoHud#hud-configuration
legacy_layout=0
position=top-left
font_size=20
background_alpha=0.4

fps
frametime
frame_timing
frame_timing_detailed
present_mode
vulkan_driver
engine_version
wine

gpu_stats
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_temp
throttling_status
vram

cpu_stats
cpu_mhz
cpu_temp
ram

toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2
output_folder=~/.local/share/mangohud-logs
log_interval=0
log_duration=0
