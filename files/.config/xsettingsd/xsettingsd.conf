# XSETTINGS for Xwayland apps (Steam, JetBrains): the same theme, icons, cursor
# and font the GTK settings.ini files name. Started by xsettingsd.service,
# which bootstrap hooks into graphical-session.target.
Net/ThemeName "adw-gtk3-matugen"
Net/IconThemeName "Matugen"
Net/SoundThemeName "ocean"
Net/CursorBlink 1
Net/CursorBlinkTime 1000
Gtk/CursorThemeName "capitaine-cursors"
Gtk/CursorThemeSize 24
Gtk/FontName "Noto Sans,  10"
Gtk/DecorationLayout "icon:minimize,maximize,close"
Gtk/EnableAnimations 1
Gtk/PrimaryButtonWarpsSlider 1
Gtk/ToolbarStyle 3
Gtk/MenuImages 1
Gtk/ButtonImages 1
Gdk/UnscaledDPI 122880
Gdk/WindowScalingFactor 1
